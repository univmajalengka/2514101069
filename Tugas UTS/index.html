
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Diskon Belanja</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .deskripsi {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 25px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 7px;
            background: #0f766e;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #115e59;
        }

        .hasil {
            display: none;
            margin-top: 25px;
            padding: 18px;
            background: #f8fafc;
            border-radius: 10px;
        }

        .baris {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 14px;
            color: #475569;
            gap: 10px;
        }

        .diskon {
            color: #16a34a;
            font-weight: bold;
        }

        .total {
            border-top: 1px solid #cbd5e1;
            padding-top: 15px;
            margin-bottom: 0;
            font-weight: bold;
            color: #0f766e;
        }

        .reset {
            background: #64748b;
        }

        .reset:hover {
            background: #475569;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Diskon Belanja</h2>
    <p class="deskripsi">
        Aplikasi penghitung potongan harga belanja
    </p>

    <label for="belanja">Masukkan Total Belanja (Rp)</label>

    <input type="number" id="belanja"
           value="150000" min="0"
           placeholder="Masukkan nominal belanja">

    <button onclick="prosesDiskon()">
        Hitung Sekarang
    </button>

    <div class="hasil" id="hasil">

        <div class="baris">
            <span>Total Belanja</span>
            <strong id="totalBelanja"></strong>
        </div>

        <div class="baris">
            <span>Persentase Diskon</span>
            <strong id="persen"></strong>
        </div>

        <div class="baris">
            <span>Potongan Harga</span>
            <strong class="diskon" id="nilaiDiskon"></strong>
        </div>

        <div class="baris total">
            <span>Total Pembayaran</span>
            <strong id="totalBayar"></strong>
        </div>

        <button class="reset" onclick="resetForm()">
            Reset
        </button>

    </div>

</div>

<script>
    // Fungsi untuk menghitung diskon
    function hitungDiskon(totalBelanja) {
        let diskon = 0;

        if (totalBelanja >= 100000) {
            diskon = totalBelanja * 0.10;
        } 
        else if (totalBelanja >= 50000) {
            diskon = totalBelanja * 0.05;
        }

        return diskon;
    }

    // Fungsi untuk menampilkan format Rupiah
    function rupiah(angka) {
        return "Rp " + angka.toLocaleString("id-ID");
    }

    // Proses perhitungan diskon
    function prosesDiskon() {
        let belanja = Number(
            document.getElementById("belanja").value
        );

        if (document.getElementById("belanja").value === "" ||
            !Number.isFinite(belanja) || belanja < 0) {
            alert("Masukkan total belanja yang valid!");
            return;
        }

        let diskon = hitungDiskon(belanja);
        let bayar = belanja - diskon;

        let persen = "0%";

        if (belanja >= 100000) {
            persen = "10%";
        } 
        else if (belanja >= 50000) {
            persen = "5%";
        }

        document.getElementById("totalBelanja").innerText =
            rupiah(belanja);

        document.getElementById("persen").innerText =
            persen;

        document.getElementById("nilaiDiskon").innerText =
            rupiah(diskon);

        document.getElementById("totalBayar").innerText =
            rupiah(bayar);

        document.getElementById("hasil").style.display = "block";
    }

    // Mengembalikan tampilan ke kondisi awal
    function resetForm() {
        document.getElementById("belanja").value = 150000;
        document.getElementById("hasil").style.display = "none";
    }

    // Menampilkan hasil awal
    prosesDiskon();
</script>

</body>
</html>
